# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft 26.2 ships without obfuscation, so no mappings are needed.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.15.5

# Mod
mod_version=1.0.4
maven_group=dca
archives_base_name=DCA

# Carpet 26.2, compiled against only (the mod is not bundled).
# The build uses libs/fabric-carpet-26.2.jar when present, otherwise downloads
# from this URL before compiling.
carpet_version=26.2
carpet_url=https://api.modrinth.com/maven/maven/modrinth/carpet/26.2/fabric-carpet-26.2%2Bv260616.jar
